name: ai-evalops-platform

x-app-environment: &app-environment
  EVALOPS_ENVIRONMENT: development
  EVALOPS_LOG_LEVEL: INFO
  EVALOPS_DATABASE_URL: postgresql+psycopg://evalops:${EVALOPS_POSTGRES_PASSWORD:-evalops}@postgres:5432/evalops
  EVALOPS_REDIS_URL: redis://redis:6379/0
  EVALOPS_ARTIFACT_BACKEND: "${EVALOPS_ARTIFACT_BACKEND:-local}"
  EVALOPS_ARTIFACT_ROOT: /data/artifacts
  EVALOPS_ARTIFACT_S3_BUCKET: "${EVALOPS_ARTIFACT_S3_BUCKET:-evalops}"
  EVALOPS_ARTIFACT_S3_PREFIX: "${EVALOPS_ARTIFACT_S3_PREFIX:-artifacts/v1}"
  EVALOPS_ARTIFACT_S3_ENDPOINT_URL: "${EVALOPS_ARTIFACT_S3_ENDPOINT_URL:-http://minio:9000}"
  EVALOPS_ARTIFACT_S3_REGION: "${EVALOPS_ARTIFACT_S3_REGION:-us-east-1}"
  EVALOPS_ARTIFACT_S3_ACCESS_KEY_ID: "${EVALOPS_ARTIFACT_S3_ACCESS_KEY_ID:-minioadmin}"
  EVALOPS_ARTIFACT_S3_SECRET_ACCESS_KEY: "${EVALOPS_ARTIFACT_S3_SECRET_ACCESS_KEY:-minioadmin}"
  EVALOPS_ARTIFACT_S3_ADDRESSING_STYLE: "${EVALOPS_ARTIFACT_S3_ADDRESSING_STYLE:-path}"
  EVALOPS_ALEMBIC_CONFIG_PATH: /app/alembic.ini
  EVALOPS_READINESS_TIMEOUT_SECONDS: "2.0"
  EVALOPS_DATABASE_RECONNECT_BASE_SECONDS: "${EVALOPS_DATABASE_RECONNECT_BASE_SECONDS:-0.5}"
  EVALOPS_DATABASE_RECONNECT_MAX_SECONDS: "${EVALOPS_DATABASE_RECONNECT_MAX_SECONDS:-30}"
  EVALOPS_DATABASE_RECONNECT_JITTER_RATIO: "${EVALOPS_DATABASE_RECONNECT_JITTER_RATIO:-0.2}"
  EVALOPS_DATASET_MAX_FILE_BYTES: "10485760"
  EVALOPS_DATASET_MAX_CASES: "10000"
  EVALOPS_DATASET_MAX_LINE_BYTES: "1048576"
  EVALOPS_WORKER_LEASE_SECONDS: "30"
  EVALOPS_WORKER_HEARTBEAT_SECONDS: "10"
  EVALOPS_WORKER_CLAIM_BATCH_SIZE: "1"
  EVALOPS_WORKER_POLL_SECONDS: "0.5"
  EVALOPS_REAPER_INTERVAL_SECONDS: "5.0"
  EVALOPS_REAPER_BATCH_SIZE: "100"
  EVALOPS_OUTBOX_POLL_SECONDS: "${EVALOPS_OUTBOX_POLL_SECONDS:-0.5}"
  EVALOPS_OUTBOX_BATCH_SIZE: "${EVALOPS_OUTBOX_BATCH_SIZE:-50}"
  EVALOPS_OUTBOX_LEASE_SECONDS: "${EVALOPS_OUTBOX_LEASE_SECONDS:-30}"
  EVALOPS_OUTBOX_PUBLISH_TIMEOUT_SECONDS: "${EVALOPS_OUTBOX_PUBLISH_TIMEOUT_SECONDS:-5}"
  EVALOPS_OUTBOX_RETRY_BASE_SECONDS: "${EVALOPS_OUTBOX_RETRY_BASE_SECONDS:-1}"
  EVALOPS_OUTBOX_RETRY_MAX_SECONDS: "${EVALOPS_OUTBOX_RETRY_MAX_SECONDS:-60}"
  EVALOPS_OUTBOX_RETENTION_SECONDS: "${EVALOPS_OUTBOX_RETENTION_SECONDS:-604800}"
  EVALOPS_OUTBOX_CLEANUP_INTERVAL_SECONDS: "${EVALOPS_OUTBOX_CLEANUP_INTERVAL_SECONDS:-60}"
  EVALOPS_OUTBOX_CLEANUP_BATCH_SIZE: "${EVALOPS_OUTBOX_CLEANUP_BATCH_SIZE:-500}"
  EVALOPS_RETRY_BASE_DELAY_SECONDS: "1.0"
  EVALOPS_RETRY_MAX_DELAY_SECONDS: "60.0"
  EVALOPS_RETRY_JITTER_RATIO: "0.2"
  EVALOPS_SSE_HEARTBEAT_SECONDS: "15.0"
  EVALOPS_SSE_FALLBACK_POLL_SECONDS: "2.0"
  EVALOPS_METRICS_ENABLED: "true"
  EVALOPS_METRICS_HOST: "0.0.0.0"
  EVALOPS_WORKER_METRICS_PORT: "9101"
  EVALOPS_REAPER_METRICS_PORT: "9102"
  EVALOPS_HTTP_TARGET_REGISTRY: "${EVALOPS_HTTP_TARGET_REGISTRY:-{}}"
  EVALOPS_OTEL_ENABLED: "true"
  EVALOPS_OTEL_SERVICE_NAME: ai-evalops-platform

x-app-service: &app-service
  build:
    context: ..
    dockerfile: Dockerfile
  image: ai-evalops-platform:phase9
  user: "10001:10001"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - "no-new-privileges:true"
  tmpfs:
    - /tmp:size=64m,mode=1777
  cpus: "${EVALOPS_APP_CPUS:-1.0}"
  mem_limit: "${EVALOPS_APP_MEMORY_LIMIT:-512m}"
  pids_limit: "${EVALOPS_APP_PIDS_LIMIT:-256}"
  environment: *app-environment

x-ready-dependencies: &ready-dependencies
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  minio:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

services:
  postgres:
    image: postgres:18.4-alpine3.24
    user: postgres
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/run/postgresql:size=16m,mode=3777
    cpus: "${EVALOPS_POSTGRES_CPUS:-1.0}"
    mem_limit: "${EVALOPS_POSTGRES_MEMORY_LIMIT:-512m}"
    pids_limit: "${EVALOPS_POSTGRES_PIDS_LIMIT:-256}"
    environment:
      POSTGRES_DB: evalops
      POSTGRES_USER: evalops
      POSTGRES_PASSWORD: ${EVALOPS_POSTGRES_PASSWORD:-evalops}
    ports:
      - "127.0.0.1:${EVALOPS_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evalops -d evalops"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8.8.1-alpine3.23
    user: redis
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    tmpfs:
      - /tmp:size=64m,mode=1777
    cpus: "${EVALOPS_REDIS_CPUS:-0.5}"
    mem_limit: "${EVALOPS_REDIS_MEMORY_LIMIT:-256m}"
    pids_limit: "${EVALOPS_REDIS_PIDS_LIMIT:-128}"
    command: ["redis-server", "--appendonly", "yes", "--loglevel", "warning"]
    ports:
      - "127.0.0.1:${EVALOPS_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    tmpfs:
      - /tmp:size=64m,mode=1777
    cpus: "${EVALOPS_MINIO_CPUS:-0.5}"
    mem_limit: "${EVALOPS_MINIO_MEMORY_LIMIT:-512m}"
    pids_limit: "${EVALOPS_MINIO_PIDS_LIMIT:-128}"
    environment:
      MINIO_ROOT_USER: "${EVALOPS_ARTIFACT_S3_ACCESS_KEY_ID:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${EVALOPS_ARTIFACT_S3_SECRET_ACCESS_KEY:-minioadmin}"
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:${EVALOPS_MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${EVALOPS_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  migrate:
    <<: *app-service
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app-service
    command:
      [
        "python",
        "-m",
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--loop",
        "app.core.event_loop:create_psycopg_compatible_event_loop",
      ]
    ports:
      - "127.0.0.1:${EVALOPS_API_PORT:-8000}:8000"
    volumes:
      - artifact_data:/data/artifacts
    depends_on: *ready-dependencies
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=2).read()",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  worker:
    <<: *app-service
    command: ["python", "-m", "app.cli", "worker"]
    expose:
      - "9101"
    volumes:
      - artifact_data:/data/artifacts
    depends_on: *ready-dependencies

  reaper:
    <<: *app-service
    command: ["python", "-m", "app.cli", "reaper"]
    expose:
      - "9102"
    depends_on: *ready-dependencies

volumes:
  artifact_data:
  minio_data:
  postgres_data:
  redis_data:
