global:
  scrape_interval: 2s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/outbox-alerts.yml

scrape_configs:
  - job_name: evalops-api
    static_configs:
      - targets: ["api:8000"]
  - job_name: evalops-worker
    static_configs:
      - targets: ["worker:9101"]
  - job_name: evalops-reaper
    static_configs:
      - targets: ["reaper:9102"]
  - job_name: evalops-audit-dispatcher
    static_configs:
      - targets: ["audit-dispatcher:9103"]
