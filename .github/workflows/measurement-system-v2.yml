name: Passive PostgreSQL Measurement System V2

on:
  push:
    branches:
      - codex/evidence-gate-1
    paths:
      - .github/measurement-system-v2-trigger.txt

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-passive-postgres-v2
  cancel-in-progress: false

jobs:
  measurement:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      EVALOPS_EXPERIMENT_DATABASE_URL: postgresql+psycopg://evalops:evalops@127.0.0.1:5432/evalops
      MEASUREMENT_OUTPUT_ROOT: docs/results/release/v0.1.0
      MEASUREMENT_CODE_SHA: 0915c10d9176191f4f306590f029ed66809cf161
      PREREGISTRATION_SHA: 1c87fb218e334790812080701bd74b81488bf19c
      INTEGRATION_FIX_PREREGISTRATION_SHA: 2180646802d41abfb5b9fdb6abd7b203cbced1fb
    outputs:
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact-name: ${{ steps.identity.outputs.artifact-name }}
      execution-id: ${{ steps.identity.outputs.execution-id }}
      execution-root: ${{ steps.identity.outputs.execution-root }}
    steps:
      - name: Check out exact execution source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync locked dependencies
        run: uv sync --locked --all-groups

      - name: Define immutable measurement identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          execution_id="measurement-system-v2-gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          execution_root="$MEASUREMENT_OUTPUT_ROOT/$execution_id"
          artifact_name="$execution_id"
          echo "execution-id=$execution_id" >> "$GITHUB_OUTPUT"
          echo "execution-root=$execution_root" >> "$GITHUB_OUTPUT"
          echo "artifact-name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "MEASUREMENT_EXECUTION_ID=$execution_id" >> "$GITHUB_ENV"
          echo "MEASUREMENT_EXECUTION_ROOT=$execution_root" >> "$GITHUB_ENV"
          mkdir -p "$execution_root/environment"
          {
            echo "source_commit=$GITHUB_SHA"
            echo "measurement_code_sha=$MEASUREMENT_CODE_SHA"
            echo "preregistration_sha=$PREREGISTRATION_SHA"
            echo "integration_fix_preregistration_sha=$INTEGRATION_FIX_PREREGISTRATION_SHA"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "workflow_run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "arm=fair-q1000-skew_20_to_1-w8-b1"
            echo "sample_jobs=100"
            echo "sampling_hz=5"
            echo "order=A:OFF,ON,ON,OFF;B:ON,OFF,OFF,ON"
            git status --short
          } > "$execution_root/environment/source.txt"

      - name: Verify preregistration and complete behavioral source lock
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$PREREGISTRATION_SHA" "$GITHUB_SHA"
          git merge-base --is-ancestor "$INTEGRATION_FIX_PREREGISTRATION_SHA" "$GITHUB_SHA"
          uv run --no-sync python -m scripts.behavioral_source_lock \
            --locked-sha "$MEASUREMENT_CODE_SHA"

      - name: Verify immutable historical evidence subtrees
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:docs/results/release/v0.1.0/targeted-gh-31327388006-1)" = \
            "234347cce8872b75595b2cf312baaf25b74091ce"
          test "$(git rev-parse HEAD:docs/results/release/v0.1.0/targeted-gh-31352270523-1)" = \
            "e321f63661645f728481ef11587f94fec9a0547a"
          test "$(git rev-parse HEAD:docs/results/release/v0.1.0/performance-attribution-gh-31400658653-1)" = \
            "e2eecf765fba7300ecd8d48f0e301c78c5cbcf96"
          test "$(git rev-parse HEAD:docs/results/release/v0.1.0/performance-attribution-requalification-gh-31407782154-1)" = \
            "adab7f560790f840f9db60eb4fbc23e62201e81b"

      - name: Start isolated PostgreSQL and Redis
        run: >-
          docker compose -f deploy/compose.yaml up --detach --wait
          --wait-timeout 180 postgres redis

      - name: Apply migrations
        run: uv run --no-sync alembic upgrade head

      - name: Record database and runtime versions
        shell: bash
        run: |
          set -euo pipefail
          {
            uv run --no-sync python --version
            uv run --no-sync python -m pip check
            docker compose -f deploy/compose.yaml exec -T postgres \
              psql -U evalops -d evalops -Atc "SELECT version()"
            docker version
            docker compose version
          } > "$MEASUREMENT_EXECUTION_ROOT/environment/versions.txt" 2>&1

      - name: Execute exactly four OFF and four ON repetitions
        shell: bash
        run: |
          set -euo pipefail
          arm_id="fair-q1000-skew_20_to_1-w8-b1"
          run_repetition() {
            local position="$1"
            local block="$2"
            local mode="$3"
            local mode_repetition="$4"
            local run_id="position-${position}-block-${block,,}-${mode,,}-rep${mode_repetition}"
            uv run --no-sync python -m scripts.run_fair_capacity_test \
              --run-id "$run_id" \
              --source-commit "$GITHUB_SHA" \
              --stage targeted \
              --queue-sizes 1000 \
              --sample-jobs 100 \
              --arm-id "$arm_id" \
              --measurement-mode "$mode" \
              --measurement-block "$block" \
              --measurement-order-position "$position" \
              --measurement-mode-repetition "$mode_repetition" \
              --measurement-code-sha "$MEASUREMENT_CODE_SHA" \
              --workflow-run-id "$GITHUB_RUN_ID" \
              --postgres-telemetry-sampling-hz 5 \
              --output-root "$MEASUREMENT_EXECUTION_ROOT"
          }
          run_repetition 1 A OFF 1
          run_repetition 2 A ON 1
          run_repetition 3 A ON 2
          run_repetition 4 A OFF 2
          run_repetition 5 B ON 3
          run_repetition 6 B OFF 3
          run_repetition 7 B OFF 4
          run_repetition 8 B ON 4

      - name: Assess the preregistered measurement system
        run: >-
          uv run --no-sync python -m scripts.measurement_system_evidence
          --source-commit "$GITHUB_SHA"
          --measurement-code-sha "$MEASUREMENT_CODE_SHA"
          --workflow-run-id "$GITHUB_RUN_ID"
          --run-directory "$MEASUREMENT_EXECUTION_ROOT/position-1-block-a-off-rep1"
          --run-directory "$MEASUREMENT_EXECUTION_ROOT/position-2-block-a-on-rep1"
          --run-directory "$MEASUREMENT_EXECUTION_ROOT/position-3-block-a-on-rep2"
          --run-directory "$MEASUREMENT_EXECUTION_ROOT/position-4-block-a-off-rep2"
          --run-directory "$MEASUREMENT_EXECUTION_ROOT/position-5-block-b-on-rep3"
          --run-directory "$MEASUREMENT_EXECUTION_ROOT/position-6-block-b-off-rep3"
          --run-directory "$MEASUREMENT_EXECUTION_ROOT/position-7-block-b-off-rep4"
          --run-directory "$MEASUREMENT_EXECUTION_ROOT/position-8-block-b-on-rep4"
          --output "$MEASUREMENT_EXECUTION_ROOT/assessment.json"

      - name: Preserve measurement environment
        if: always() && env.MEASUREMENT_EXECUTION_ROOT != ''
        shell: bash
        run: |
          set +e
          evidence_dir="$MEASUREMENT_EXECUTION_ROOT/environment"
          mkdir -p "$evidence_dir"
          {
            echo "github_run_id=$GITHUB_RUN_ID"
            echo "github_run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "github_sha=$GITHUB_SHA"
            echo "runner_os=$RUNNER_OS"
            uname -a
            lscpu
            free -b
            df -B1 .
          } > "$evidence_dir/runner.txt" 2>&1
          docker compose -f deploy/compose.yaml ps --all > "$evidence_dir/compose-ps.txt" 2>&1
          docker compose -f deploy/compose.yaml logs --no-color \
            > "$evidence_dir/compose.log" 2>&1

      - name: Stop isolated topology
        if: always()
        run: docker compose -f deploy/compose.yaml down --volumes

      - name: Upload immutable measurement evidence
        id: upload
        if: always() && env.MEASUREMENT_EXECUTION_ROOT != ''
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.identity.outputs.artifact-name }}
          path: ${{ env.MEASUREMENT_EXECUTION_ROOT }}
          if-no-files-found: error
          retention-days: 90

  preservation:
    needs: measurement
    if: ${{ always() && needs.measurement.outputs.artifact-name != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out exact trigger source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install Python and locked dependencies
        run: |
          uv python install 3.12
          uv sync --locked --all-groups

      - name: Download exact measurement artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ needs.measurement.outputs.artifact-name }}
          path: ${{ needs.measurement.outputs.execution-root }}

      - name: Seal evidence and push only on unchanged branch
        shell: bash
        env:
          ARTIFACT_DIGEST: ${{ needs.measurement.outputs.artifact-digest }}
          EXECUTION_ID: ${{ needs.measurement.outputs.execution-id }}
          EXECUTION_ROOT: ${{ needs.measurement.outputs.execution-root }}
        run: |
          set -euo pipefail
          printf '%s\n' "$ARTIFACT_DIGEST" > "$EXECUTION_ROOT/environment/artifact-digest.txt"
          uv run --no-sync python -c \
            "from pathlib import Path; from scripts.fair_capacity_evidence import write_release_manifest; write_release_manifest(Path('$EXECUTION_ROOT'), source_commit='$GITHUB_SHA', claim_scope='passive_postgres_measurement_system_v2', schema_version=2)"
          git fetch origin codex/evidence-gate-1
          remote_tip="$(git rev-parse origin/codex/evidence-gate-1)"
          if [[ "$remote_tip" != "$GITHUB_SHA" ]]; then
            echo "PRESERVATION_CONFLICT remote=$remote_tip expected=$GITHUB_SHA" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$EXECUTION_ROOT"
          git diff --cached --quiet && exit 1
          git commit -m "evidence(perf): preserve passive measurement qualification $EXECUTION_ID"
          if ! git push origin "HEAD:codex/evidence-gate-1"; then
            echo "PRESERVATION_CONFLICT push rejected" >&2
            exit 1
          fi
