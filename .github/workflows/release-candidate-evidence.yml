name: Release Candidate - Fair Capacity Evidence

on:
  push:
    branches:
      - codex/evidence-gate-1
    paths:
      - .github/release-candidate-trigger.txt
      - .github/workflows/release-candidate-evidence.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-candidate-fair-capacity
  cancel-in-progress: false

jobs:
  fair-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      EVALOPS_EXPERIMENT_DATABASE_URL: postgresql+psycopg://evalops:evalops@127.0.0.1:5432/evalops
      RC_OUTPUT_ROOT: docs/results/release/v0.1.0
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync locked dependencies
        run: uv sync --locked --all-groups

      - name: Define immutable release-candidate identity
        shell: bash
        run: |
          set -euo pipefail
          execution_id="rc-gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          execution_root="$RC_OUTPUT_ROOT/$execution_id"
          echo "RC_EXECUTION_ID=$execution_id" >> "$GITHUB_ENV"
          echo "RC_EXECUTION_ROOT=$execution_root" >> "$GITHUB_ENV"
          mkdir -p "$execution_root/environment"
          {
            echo "source_commit=$GITHUB_SHA"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "workflow_run_attempt=$GITHUB_RUN_ATTEMPT"
            git status --short
          } > "$execution_root/environment/source.txt"

      - name: Start PostgreSQL and Redis with Compose
        run: >-
          docker compose -f deploy/compose.yaml up --detach --wait
          --wait-timeout 180 postgres redis

      - name: Apply migrations
        run: uv run --no-sync alembic upgrade head

      - name: Execute and verify 1k and 10k queues
        run: >-
          uv run --no-sync python -m scripts.run_fair_capacity_test
          --run-id initial
          --source-commit "$GITHUB_SHA"
          --stage initial
          --queue-sizes "1000,10000"
          --sample-jobs 500
          --output-root "$RC_EXECUTION_ROOT"

      - name: Execute and verify 100k queue after initial gate
        run: >-
          uv run --no-sync python -m scripts.run_fair_capacity_test
          --run-id large
          --source-commit "$GITHUB_SHA"
          --stage large
          --queue-sizes "100000"
          --prior-assessment "$RC_EXECUTION_ROOT/initial/assessment.json"
          --sample-jobs 500
          --output-root "$RC_EXECUTION_ROOT"

      - name: Preserve runner and Compose diagnostics
        if: always() && env.RC_EXECUTION_ROOT != ''
        shell: bash
        run: |
          set +e
          evidence_dir="$RC_EXECUTION_ROOT/environment"
          mkdir -p "$evidence_dir"
          {
            echo "github_run_id=$GITHUB_RUN_ID"
            echo "github_run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "github_sha=$GITHUB_SHA"
            echo "runner_os=$RUNNER_OS"
            uname -a
            lscpu
            free -b
            df -B1 .
            docker version
            docker compose version
          } > "$evidence_dir/runner.txt" 2>&1
          docker compose -f deploy/compose.yaml ps --all \
            > "$evidence_dir/compose-ps.txt" 2>&1
          docker compose -f deploy/compose.yaml logs --no-color \
            > "$evidence_dir/compose.log" 2>&1

      - name: Upload evidence even when execution fails
        if: always() && env.RC_EXECUTION_ROOT != ''
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.RC_EXECUTION_ID }}
          path: ${{ env.RC_EXECUTION_ROOT }}
          if-no-files-found: error
          retention-days: 90

      - name: Commit immutable evidence to the target branch
        if: always() && env.RC_EXECUTION_ROOT != ''
        shell: bash
        run: |
          set -euo pipefail
          test -d "$RC_EXECUTION_ROOT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$RC_EXECUTION_ROOT"
          if git diff --cached --quiet; then
            echo "No release-candidate evidence files were produced."
            exit 1
          fi
          git commit -m "evidence(release): preserve fair capacity run $RC_EXECUTION_ID"
          git push origin "HEAD:codex/evidence-gate-1"

      - name: Stop the isolated Compose topology
        if: always()
        run: docker compose -f deploy/compose.yaml down --volumes
