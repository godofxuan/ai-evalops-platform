name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality-and-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine3.24
        env:
          POSTGRES_DB: evalops
          POSTGRES_USER: evalops
          POSTGRES_PASSWORD: evalops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evalops -d evalops"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8.8.1-alpine3.23
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      EVALOPS_ENVIRONMENT: test
      EVALOPS_DATABASE_URL: postgresql+psycopg://evalops:evalops@127.0.0.1:5432/evalops
      EVALOPS_REDIS_URL: redis://127.0.0.1:6379/0
      # The runner context is unavailable while job-level env is evaluated.
      EVALOPS_ARTIFACT_ROOT: /tmp/evalops-artifacts
      EVALOPS_ALEMBIC_CONFIG_PATH: alembic.ini
      EVALOPS_RUN_INTEGRATION: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync locked dependencies
        run: uv sync --locked --all-groups

      - name: Check lock file
        run: uv lock --check

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Type check
        run: uv run --no-sync mypy app scripts tests/integration tests/concurrency

      - name: Run tests without external services
        run: uv run --no-sync pytest -m "not integration"

      - name: Prepare artifact directory
        run: mkdir -p "$EVALOPS_ARTIFACT_ROOT"

      - name: Apply migrations
        run: uv run --no-sync alembic upgrade head

      - name: Integration - job claiming, trace propagation, and lease fencing
        if: ${{ !cancelled() }}
        run: >-
          uv run --no-sync pytest tests/concurrency/test_job_claiming.py
          --junitxml=/tmp/junit-job-claiming.xml

      - name: Integration - blinded human review
        if: ${{ !cancelled() }}
        run: >-
          uv run --no-sync pytest tests/integration/test_human_reviews.py
          --junitxml=/tmp/junit-human-reviews.xml

      - name: Integration - tenant identity and immutable datasets
        if: ${{ !cancelled() }}
        run: >-
          uv run --no-sync pytest tests/integration/test_identity_and_datasets.py
          --junitxml=/tmp/junit-identity-datasets.xml

      - name: Integration - artifact blob and reference ownership
        if: ${{ !cancelled() }}
        run: >-
          uv run --no-sync pytest tests/integration/test_artifact_references.py
          --junitxml=/tmp/junit-artifact-references.xml

      - name: Integration - cross-table tenant consistency constraints
        if: ${{ !cancelled() }}
        run: >-
          uv run --no-sync pytest
          tests/integration/test_tenant_consistency_constraints.py
          --junitxml=/tmp/junit-tenant-consistency.xml

      - name: Integration - readiness dependencies
        if: ${{ !cancelled() }}
        run: >-
          uv run --no-sync pytest tests/integration/test_readiness.py
          --junitxml=/tmp/junit-readiness.xml

      - name: Integration - Redis event isolation
        if: ${{ !cancelled() }}
        run: >-
          uv run --no-sync pytest tests/integration/test_redis_events.py
          --junitxml=/tmp/junit-redis-events.xml

      - name: Integration - Run idempotency and tenant boundary
        if: ${{ !cancelled() }}
        run: >-
          uv run --no-sync pytest tests/integration/test_run_idempotency.py
          --junitxml=/tmp/junit-run-idempotency.xml

      - name: Migration - P2 downgrade and re-upgrade
        if: ${{ !cancelled() }}
        run: |
          uv run --no-sync alembic downgrade 20260802_0009
          uv run --no-sync alembic upgrade head

      - name: Annotate integration failures
        if: ${{ failure() && !cancelled() }}
        run: >-
          uv run --no-sync python scripts/ci_annotations.py junit
          /tmp/junit-job-claiming.xml
          /tmp/junit-human-reviews.xml
          /tmp/junit-identity-datasets.xml
          /tmp/junit-artifact-references.xml
          /tmp/junit-tenant-consistency.xml
          /tmp/junit-readiness.xml
          /tmp/junit-redis-events.xml
          /tmp/junit-run-idempotency.xml

      - name: Build application image
        if: ${{ !cancelled() }}
        run: docker build --tag ai-evalops-platform:ci .

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build the complete current topology
        run: docker compose -f deploy/compose.yaml build

      - name: Start and wait for PostgreSQL and Redis
        run: >-
          docker compose -f deploy/compose.yaml up --detach --wait
          --wait-timeout 180 postgres redis

      - name: Apply migrations in the Compose topology
        run: docker compose -f deploy/compose.yaml run --rm --no-deps migrate

      - name: Start API, Worker, and Reaper
        run: >-
          docker compose -f deploy/compose.yaml up --detach --no-deps
          api worker reaper

      - name: Verify readiness through the published API port
        run: >-
          curl --fail --silent --show-error
          --retry 20 --retry-all-errors --retry-delay 2
          http://127.0.0.1:8000/health/ready

      - name: Verify effective container hardening
        run: >-
          python3 scripts/verify_compose_hardening.py
          --compose-file deploy/compose.yaml
          postgres redis api worker reaper

      - name: Preserve Compose diagnostics
        if: always()
        run: docker compose -f deploy/compose.yaml ps && docker compose -f deploy/compose.yaml logs --no-color

      - name: Annotate Compose startup failure
        if: ${{ failure() && !cancelled() }}
        run: |
          docker compose -f deploy/compose.yaml ps --all > /tmp/compose-diagnostics.txt
          docker compose -f deploy/compose.yaml logs --no-color --tail 80 >> /tmp/compose-diagnostics.txt
          python3 scripts/ci_annotations.py text \
            --title "Compose startup failure" \
            /tmp/compose-diagnostics.txt

      - name: Stop Compose topology
        if: always()
        run: docker compose -f deploy/compose.yaml down --volumes
